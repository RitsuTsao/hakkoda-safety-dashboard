name: Apply notification layer patch

on:
  push:
    branches:
      - codex/notification-layer-v1

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/notification-layer-v1
          fetch-depth: 0
      - name: Apply notification layer patch
        env:
          BASE_SHA: 5c8c359d80976844671f04ea0a6257f098112881
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d | gunzip > /tmp/notification-layer.patch
          git checkout "$BASE_SHA" -- .github/workflows/update-data.yml
          git rm -f .github/workflows/apply-notification-layer.yml || true
          git apply /tmp/notification-layer.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add notification layer with Gmail alerts"
          git push origin HEAD:codex/notification-layer-v1
